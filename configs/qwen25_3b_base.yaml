model_name: "Qwen/Qwen2.5-3B"
output_dir: "./outputs/qwen25_3b_ddp_base"

dataset_name: "roneneldan/TinyStories"
train_split: "train[:100000]"
eval_split: "validation[:2000]"

max_length: 512
epochs: 1

micro_batch_size: 1
grad_accum_steps: 16

learning_rate: 1.0e-5
weight_decay: 0.1
warmup_ratio: 0.03
grad_clip: 1.0

num_workers: 2
seed: 42

dtype: "bfloat16"

log_every: 10
save_every: 200
eval_every: 100
enable_throughput_logging: true

resume_from: null
save_optimizer: true
